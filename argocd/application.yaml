apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: hireflow
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/kaushalchauhan84850/hairflow-gitops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: hireflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false